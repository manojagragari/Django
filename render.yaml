# Render blueprint for the ElectroShop Management System.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
# Both services are free-tier friendly. SECRET_KEY is generated by Render;
# DATABASE_URL must be pasted in from your Postgres provider (Neon/Render).

services:
  # ---------------------------------------------------------------
  # Django REST API
  # ---------------------------------------------------------------
  - type: web
    name: electroshop-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "bash start.sh"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      # Paste your Postgres connection string here (Neon, Supabase or Render).
      - key: DATABASE_URL
        sync: false
      # Comma separated. Render also auto-trusts RENDER_EXTERNAL_HOSTNAME.
      - key: ALLOWED_HOSTS
        value: "django-394y.onrender.com,localhost,127.0.0.1"
      # Must list the deployed frontend origin, or the browser blocks every call.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://django-1-ucq2.onrender.com,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://django-1-ucq2.onrender.com,http://localhost:3000"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: WEB_CONCURRENCY
        value: "2"
      # Set a password here to have start.sh create the first admin account.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ---------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------
  - type: web
    name: electroshop-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Baked into the bundle at build time, so it must be set before building.
      - key: NEXT_PUBLIC_API_URL
        value: "https://django-394y.onrender.com/api"
